[package]
name = "the-almighty-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "sink", "std"] }
rusqlite = "0.32"
hmac = "0.12"
sha2 = "0.10"
quick-xml = "0.42.0"

